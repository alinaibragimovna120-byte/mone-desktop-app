# Собирает веб-версию Mone App и выкладывает её на GitHub Pages.
# Её открывают на iPhone в Safari и добавляют на экран «Домой» —
# без App Store, компьютера и аккаунта разработчика Apple.
# Запускается при каждой отправке в main или вручную на вкладке Actions.
# Один раз нужно включить: Settings → Pages → Source: GitHub Actions.
name: Веб-версия (iPhone и браузер)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
